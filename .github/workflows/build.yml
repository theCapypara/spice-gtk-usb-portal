name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: cargo build (default)
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/action/setup-fedora
      - run: cargo build --workspace --all-targets
      - run: cargo test --doc

  build_no_default:
    name: cargo build (no default)
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/action/setup-fedora
      - run: cargo build --workspace --all-targets --no-default-features --features=parent_window_gtk4

  build_capi:
    name: cargo build (capi)
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/action/setup-fedora
      - run: cargo build --workspace --all-targets --no-default-features --features=capi

  doc:
    name: cargo doc
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/action/setup-fedora
      - run: cargo doc --no-deps --all-features

  doctest:
    name: cargo test --doc
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/action/setup-fedora
      - run: cargo test --doc
